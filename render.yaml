services:
  - type: worker
    name: arena-quiz-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: arena-db
          property: connectionString

databases:
  - name: arena-db
    databaseName: tg_bot
    plan: free
